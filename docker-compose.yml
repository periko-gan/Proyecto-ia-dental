services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: dental_ai
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "27017:27017"
    networks:
      - dental_ai_net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/2181'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "2181:2181"
    networks:
      - dental_ai_net

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: -Xms1g -Xmx1g
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    ports:
      - "9092:9092"
    networks:
      - dental_ai_net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    ports:
      - "8085:8080"
    networks:
      - dental_ai_net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DENTAL_AI_ENV: production
      DENTAL_AI_HOST: 0.0.0.0
      DENTAL_AI_PORT: 8000
      DENTAL_AI_MONGO_URI: mongodb://mongo:27017
      DENTAL_AI_MONGO_DB_NAME: dental_ai
      DENTAL_AI_MONGO_ANALYSES_COLLECTION: analyses
      DENTAL_AI_MONGO_USERS_COLLECTION: users
      DENTAL_AI_MODEL_PATH: ../entrenamiento ia/runs/train/dental_definitivo_optimizado_medium/weights/best.pt
      DENTAL_AI_MODEL_VERSION: best.pt
      DENTAL_AI_MODEL_DEVICE: auto
      DENTAL_AI_MODEL_WARMUP_ON_STARTUP: "true"
      DENTAL_AI_MODEL_CONFIDENCE: "0.25"
      DENTAL_AI_MODEL_IOU: "0.45"
      DENTAL_AI_UPLOADS_DIR: ./storage/uploads
      DENTAL_AI_MAX_FILE_SIZE_BYTES: "10485760"
      DENTAL_AI_ALLOWED_MIME_TYPES: image/jpeg,image/png
      DENTAL_AI_LOG_LEVEL: INFO
      DENTAL_AI_EVENTS_ENABLED: "true"
      DENTAL_AI_EVENTS_TRANSPORT: kafka
      DENTAL_AI_KAFKA_ENABLED: "true"
      DENTAL_AI_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DENTAL_AI_KAFKA_INFERENCE_CONSUMER_ENABLED: "false"
      DENTAL_AI_KAFKA_INFERENCE_CONSUMER_GROUP_ID: dental-inference-consumer
      DENTAL_AI_KAFKA_INFERENCE_CONSUMER_OFFSET_RESET: latest
      DENTAL_AI_EVENT_FORMAT_VERSION: "1"
      DENTAL_AI_EVENT_DEAD_LETTER_ENABLED: "true"
      DENTAL_AI_MONGO_DEAD_LETTER_COLLECTION: dead_letter_events
      DENTAL_AI_AUTH_JWT_SECRET: change-this-secret-in-production
      DENTAL_AI_AUTH_JWT_ALGORITHM: HS256
      DENTAL_AI_AUTH_ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
    volumes:
      - backend_uploads:/app/backend/storage/uploads
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()\""]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s
    ports:
      - "8000:8000"
    networks:
      - dental_ai_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_GRAPHQL_ENDPOINT: /graphql
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    networks:
      - dental_ai_net

volumes:
  mongo_data:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  backend_uploads:

networks:
  dental_ai_net:
    driver: bridge

