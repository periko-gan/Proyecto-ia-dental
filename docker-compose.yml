services:
  # ==========================================
  # FRONTEND
  # ==========================================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: frontend-web
    ports:
      - "8080:80"
    restart: unless-stopped
    networks:
      - ia_dental_net

  # ==========================================
  # BACKEND & DATABASE
  # ==========================================
  mongo:
    image: mongo:7
    container_name: dental-ai-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: dental_ai
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ia_dental_net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: backend-api
    working_dir: /app/backend
    environment:
      - DENTAL_AI_MONGO_URI=mongodb://mongo:27017
      - DENTAL_AI_MODEL_PATH=src/model/best.pt
    volumes:
      - ./backend:/app/backend
      - backend_uploads:/app/backend/storage/uploads
    # Lanza uvicorn tal y como lo has solicitado
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      - mongo
    networks:
      - ia_dental_net

  # ==========================================
  # MENSAJERÍA Y EVENTOS (KAFKA + ZOOKEEPER)
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    container_name: zookeeper_proyecto
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    networks:
      - ia_dental_net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/2181'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: kafka_proyecto
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: -Xms1g -Xmx1g
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - ia_dental_net
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka_ui_proyecto
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - ia_dental_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M



volumes:
  backend_uploads:
  mongo_data:
  zookeeper_data:
    name: ia_dental_zookeeper_data
  zookeeper_log:
    name: ia_dental_zookeeper_log
  kafka_data:
    name: ia_dental_kafka_data

networks:
  ia_dental_net:
    driver: bridge
